services:
  - type: web
    name: neuralops-api
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: NEURALOPS_ENVIRONMENT
        value: production
      - key: NEURALOPS_POSTGRES_SCHEMA
        value: neuralops_private
      - key: NEURALOPS_POSTGRES_TABLE
        value: records
      - key: NEURALOPS_AUTH_REQUIRED
        value: "true"
      - key: NEURALOPS_DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: NEURALOPS_CORS_ORIGINS
        sync: false
      - key: NEURALOPS_DELIVERY_SEND_ENABLED
        value: "false"
      - key: NEURALOPS_GITHUB_SEND_ENABLED
        value: "false"
      - key: GITHUB_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
