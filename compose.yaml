services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NEURALOPS_DB_PATH: /data/neuralops.sqlite3
      NEURALOPS_AUTH_REQUIRED: "false"
      NEURALOPS_ENVIRONMENT: local
      NEURALOPS_CORS_ORIGINS: http://localhost:5173
      NEURALOPS_DELIVERY_SEND_ENABLED: "false"
      NEURALOPS_GITHUB_SEND_ENABLED: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - neuralops_sqlite_data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  neuralops_sqlite_data:
