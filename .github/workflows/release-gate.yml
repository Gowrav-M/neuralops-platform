name: NeuralOps Release Gate

on:
  workflow_dispatch:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r backend/requirements.txt

      - name: Verify app before gate
        run: |
          npm run lint
          npm run build
          python -m pytest backend

      - name: Start NeuralOps API
        shell: bash
        run: |
          NEURALOPS_AUTH_REQUIRED=false python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          exit 1

      - name: Seed CI release evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request

          base_url = "http://127.0.0.1:8000"

          def request(path, payload, token=None):
              data = json.dumps(payload).encode("utf-8")
              headers = {"Content-Type": "application/json"}
              if token:
                  headers["x-neuralops-key"] = token
              req = urllib.request.Request(f"{base_url}{path}", data=data, headers=headers, method="POST")
              with urllib.request.urlopen(req, timeout=10) as response:
                  return json.loads(response.read().decode("utf-8"))

          key = request(
              "/api/settings/api-keys",
              {
                  "name": "ci release gate ingest",
                  "role": "Developer",
                  "environment": "all",
                  "scopes": ["trace:ingest"],
              },
          )["token"]

          for index in range(3):
              request(
                  "/api/traces/ingest",
                  {
                      "session": f"ci-proof-{index}",
                      "environment": "dev",
                      "model": "ci-release-proof",
                      "tokens": 120,
                      "latencyMs": 180,
                      "status": "success",
                      "score": 0.98,
                      "prompt": "CI release evidence trace",
                      "output": "Release evidence path passed deterministic policy checks.",
                  },
                  token=key,
              )
          PY

      - name: Run local release gate
        uses: ./
        with:
          base-url: http://127.0.0.1:8000
          target: ci
          require-auth: "false"
          fail-on: block
