name: NeuralOps Release Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r backend/requirements.txt

      - name: Verify app before gate
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          (
            set -e
            npm audit --audit-level=high
            npm run test:sdk
            npm run test:deployment
            npm run lint
            npm run build
            python -m pytest backend
          )
          preflight_exit=$?
          PREFLIGHT_EXIT="$preflight_exit" python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          status = int(os.environ["PREFLIGHT_EXIT"])
          with open("artifacts/release-gate.json", "w", encoding="utf-8") as artifact:
              json.dump(
                  {
                      "schemaVersion": 1,
                      "generatedAt": datetime.now(timezone.utc).isoformat(),
                      "outcome": "preflight_pass" if status == 0 else "preflight_fail",
                      "exitCode": status,
                  },
                  artifact,
                  indent=2,
              )
              artifact.write("\n")
          PY
          exit "$preflight_exit"

      - name: Start NeuralOps API
        shell: bash
        run: |
          NEURALOPS_AUTH_REQUIRED=false python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8000/ready && exit 0
            sleep 1
          done
          exit 1

      - name: Seed CI release evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request

          base_url = "http://127.0.0.1:8000"

          def request(path, payload, token=None):
              data = json.dumps(payload).encode("utf-8")
              headers = {"Content-Type": "application/json"}
              if token:
                  headers["x-neuralops-key"] = token
              req = urllib.request.Request(f"{base_url}{path}", data=data, headers=headers, method="POST")
              with urllib.request.urlopen(req, timeout=10) as response:
                  return json.loads(response.read().decode("utf-8"))

          key = request(
              "/api/settings/api-keys",
              {
                  "name": "ci release gate ingest",
                  "role": "Developer",
                  "environment": "all",
                  "scopes": ["trace:ingest"],
              },
          )["token"]

          for index in range(3):
              request(
                  "/api/traces/ingest",
                  {
                      "session": f"ci-proof-{index}",
                      "environment": "dev",
                      "model": "ci-release-proof",
                      "tokens": 120,
                      "latencyMs": 180,
                      "status": "success",
                      "score": 0.98,
                      "prompt": "CI release evidence trace",
                      "output": "Release evidence path passed deterministic policy checks.",
                  },
                  token=key,
              )
          PY

      - name: Run local release gate and retain evidence
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          node sdk/javascript/bin/neuralops.mjs release-gate run \
            --base-url http://127.0.0.1:8000 \
            --target ci \
            --require-auth false \
            --fail-on block \
            --json > artifacts/release-gate.json
          gate_exit=$?
          set -e
          cat artifacts/release-gate.json
          exit "$gate_exit"

      - name: Upload release-gate evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: neuralops-release-gate-${{ github.run_id }}
          path: artifacts/release-gate.json
          if-no-files-found: error
          retention-days: 30
