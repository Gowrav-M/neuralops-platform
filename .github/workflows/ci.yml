name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Validate Apache-2.0 project metadata
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const packageJson = JSON.parse(readFileSync('package.json', 'utf8'));
          const license = readFileSync('LICENSE', 'utf8');
          if (packageJson.license !== 'Apache-2.0') {
            throw new Error('package.json must declare Apache-2.0');
          }
          if (!license.includes('Apache License') || !license.includes('Version 2.0')) {
            throw new Error('LICENSE must contain the Apache License 2.0 text');
          }
          NODE

      - name: Lint frontend
        run: npm run lint

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Test SDK contracts
        run: npm run test:sdk

      - name: Test deployment verifier
        run: npm run test:deployment

      - name: Build frontend
        run: npm run build

      - name: Test backend API
        run: python -m pytest backend

  security-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Audit backend dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit -r backend/requirements.txt

      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            --output gitleaks_8.30.1_linux_x64.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          install -m 0755 gitleaks "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan full Git history for leaked credentials
        shell: bash
        run: gitleaks git --redact=100 --no-banner --log-opts=--all .

  e2e:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          npx playwright install --with-deps chromium

      - name: Run desktop and mobile acceptance
        run: |
          npm run test:e2e
          npm run test:e2e:landing
