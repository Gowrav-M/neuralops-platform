name: Deploy Production

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'Gowrav-M/neuralops-platform' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      NEURALOPS_DEPLOYMENT_EVIDENCE_PATH: artifacts/deployment-verification.json
      NEURALOPS_DEPLOYED_FAIL_ON: block

    steps:
      - uses: actions/checkout@v6

      - name: Initialize deployment evidence
        shell: bash
        run: |
          mkdir -p artifacts
          printf '{"status":"not_started"}\n' > artifacts/image-preflight.json
          printf '{"status":"not_started"}\n' > artifacts/image-manifest.json
          printf '{"status":"not_started"}\n' > artifacts/migration-verification.json
          printf 'not_started\n' > artifacts/migration-verification.txt
          printf '{"status":"not_started"}\n' > artifacts/readiness.json
          printf 'not_started\n' > artifacts/readiness.txt
          printf '{"status":"not_started"}\n' > artifacts/render-deploy.json
          printf '{"status":"not_started"}\n' > artifacts/render-deploy-status.json
          printf '{"status":"not_started"}\n' > artifacts/deployment-verification.json
          printf 'not_started\n' > artifacts/supabase-rls.txt

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v3

      - name: Validate required production configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          NEURALOPS_DEPLOYED_API_URL: ${{ vars.NEURALOPS_DEPLOYED_API_URL }}
          NEURALOPS_DEPLOYED_FRONTEND_URL: ${{ vars.NEURALOPS_DEPLOYED_FRONTEND_URL }}
          NEURALOPS_QA_AUTH_TOKEN: ${{ secrets.NEURALOPS_QA_AUTH_TOKEN }}
          NEURALOPS_WORKSPACE_ID: ${{ secrets.NEURALOPS_QA_WORKSPACE_ID }}
        shell: bash
        run: |
          for name in DATABASE_URL RENDER_API_KEY RENDER_SERVICE_ID NEURALOPS_DEPLOYED_API_URL NEURALOPS_DEPLOYED_FRONTEND_URL NEURALOPS_QA_AUTH_TOKEN NEURALOPS_WORKSPACE_ID; do
            if [ -z "${!name}" ]; then
              echo "Required production configuration is unavailable: $name"
              exit 1
            fi
          done

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable backend image digest
        shell: bash
        run: |
          image_tag="ghcr.io/gowrav-m/neuralops-api:${GITHUB_SHA}"
          docker buildx imagetools inspect "$image_tag" --raw > artifacts/image-manifest.json
          image_digest="$(docker buildx imagetools inspect "$image_tag" --format '{{.Digest}}')"
          [[ "$image_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          IMAGE_REFERENCE="ghcr.io/gowrav-m/neuralops-api@${image_digest}"
          jq -n \
            --arg source "$image_tag" \
            --arg digest "$image_digest" \
            --arg image "$IMAGE_REFERENCE" \
            '{schemaVersion: 1, status: "verified", source: $source, digest: $digest, image: $image}' \
            > artifacts/image-preflight.json
          echo "IMAGE_REFERENCE=$IMAGE_REFERENCE" >> "$GITHUB_ENV"

      - name: Apply reviewed Supabase migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import psycopg

          migration = Path("supabase/migrations/20260715225812_add_agent_credential_hash_index.sql")
          sql = migration.read_text(encoding="utf-8")
          with psycopg.connect(os.environ["DATABASE_URL"], connect_timeout=10) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(sql)
                  cursor.execute(
                      "select to_regclass('neuralops_private.records_agent_identity_credential_hash_idx') is not null"
                  )
                  if cursor.fetchone() != (True,):
                      raise SystemExit("credential hash index verification failed")

          evidence = {
              "schemaVersion": 1,
              "migration": str(migration),
              "status": "verified",
              "verifiedIndex": "neuralops_private.records_agent_identity_credential_hash_idx",
          }
          Path("artifacts/migration-verification.json").write_text(
              json.dumps(evidence, indent=2) + "\n",
              encoding="utf-8",
          )
          Path("artifacts/migration-verification.txt").write_text(
              "migration_verified=records_agent_identity_credential_hash_idx\n",
              encoding="utf-8",
          )
          PY

      - name: Deploy immutable image to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "{\"imageUrl\":\"${IMAGE_REFERENCE}\"}" \
            > artifacts/render-deploy.json

          deploy_id="$(jq -r '.id // empty' artifacts/render-deploy.json)"
          test -n "$deploy_id"
          for attempt in {1..60}; do
            curl --fail-with-body --silent --show-error \
              --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${deploy_id}" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              > artifacts/render-deploy-status.json
            status="$(jq -r '.status // empty' artifacts/render-deploy-status.json)"
            if [ "$status" = "live" ]; then
              break
            fi
            if [[ "$status" == *failed ]] || [ "$status" = "canceled" ]; then
              jq '{id,status,createdAt,finishedAt}' artifacts/render-deploy-status.json
              exit 1
            fi
            sleep 5
          done
          test "$status" = "live"

      - name: Verify Render Postgres readiness
        env:
          NEURALOPS_DEPLOYED_API_URL: ${{ vars.NEURALOPS_DEPLOYED_API_URL }}
        shell: bash
        run: |
          for attempt in {1..18}; do
            if payload="$(curl --fail --silent --show-error "${NEURALOPS_DEPLOYED_API_URL}/ready")"; then
              echo "$payload" | jq -e '.ok == true and .storage == "postgres" and .startup == "ready"'
              printf '%s\n' "$payload" > artifacts/readiness.json
              printf 'readiness_verified=postgres\n' > artifacts/readiness.txt
              exit 0
            fi
            sleep 5
          done
          echo "Render backend did not report Postgres readiness within the bounded window."
          exit 1

      - name: Verify Supabase row-level security
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: python backend/scripts/verify_supabase_rls.py > artifacts/supabase-rls.txt

      - name: Run authenticated production acceptance
        env:
          NEURALOPS_DEPLOYED_API_URL: ${{ vars.NEURALOPS_DEPLOYED_API_URL }}
          NEURALOPS_DEPLOYED_FRONTEND_URL: ${{ vars.NEURALOPS_DEPLOYED_FRONTEND_URL }}
          NEURALOPS_QA_AUTH_TOKEN: ${{ secrets.NEURALOPS_QA_AUTH_TOKEN }}
          NEURALOPS_WORKSPACE_ID: ${{ secrets.NEURALOPS_QA_WORKSPACE_ID }}
        shell: bash
        run: node scripts/verify-deployment.mjs

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-deploy-${{ github.sha }}
          path: |
            artifacts/image-preflight.json
            artifacts/image-manifest.json
            artifacts/migration-verification.json
            artifacts/migration-verification.txt
            artifacts/readiness.json
            artifacts/readiness.txt
            artifacts/render-deploy*.json
            artifacts/deployment-verification.json
            artifacts/supabase-rls.txt
          if-no-files-found: error
          retention-days: 30
