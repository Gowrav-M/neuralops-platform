name: Deploy Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'Gowrav-M/neuralops-platform' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      NEURALOPS_DEPLOYED_API_URL: ${{ vars.NEURALOPS_DEPLOYED_API_URL }}
      NEURALOPS_DEPLOYED_FRONTEND_URL: ${{ vars.NEURALOPS_DEPLOYED_FRONTEND_URL }}
      NEURALOPS_QA_AUTH_TOKEN: ${{ secrets.NEURALOPS_QA_AUTH_TOKEN }}
      NEURALOPS_WORKSPACE_ID: ${{ secrets.NEURALOPS_QA_WORKSPACE_ID }}
      NEURALOPS_DEPLOYMENT_EVIDENCE_PATH: artifacts/deployment-verification.json
      NEURALOPS_DEPLOYED_FAIL_ON: block

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate required production configuration
        shell: bash
        run: |
          for name in DATABASE_URL RENDER_API_KEY RENDER_SERVICE_ID NEURALOPS_DEPLOYED_API_URL NEURALOPS_DEPLOYED_FRONTEND_URL NEURALOPS_QA_AUTH_TOKEN NEURALOPS_WORKSPACE_ID; do
            if [ -z "${!name}" ]; then
              echo "Required production configuration is unavailable: $name"
              exit 1
            fi
          done

      - name: Apply reviewed Supabase migration
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
          python - <<'PY'
          import os
          from pathlib import Path

          import psycopg

          migration = Path("supabase/migrations/20260715225812_add_agent_credential_hash_index.sql")
          sql = migration.read_text(encoding="utf-8")
          with psycopg.connect(os.environ["DATABASE_URL"], connect_timeout=10) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(sql)
                  cursor.execute(
                      "select to_regclass('neuralops_private.records_agent_identity_credential_hash_idx') is not null"
                  )
                  if cursor.fetchone() != (True,):
                      raise SystemExit("credential hash index verification failed")
          print("migration_verified=records_agent_identity_credential_hash_idx")
          PY

      - name: Deploy immutable image to Render
        shell: bash
        run: |
          mkdir -p artifacts
          curl --fail-with-body --silent --show-error             --request POST             --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys"             --header "Authorization: Bearer ${RENDER_API_KEY}"             --header "Content-Type: application/json"             --data "{\"imageUrl\":\"ghcr.io/gowrav-m/neuralops-api:${GITHUB_SHA}\"}"             > artifacts/render-deploy.json

          deploy_id="$(jq -r '.id // empty' artifacts/render-deploy.json)"
          test -n "$deploy_id"
          for attempt in {1..60}; do
            curl --fail-with-body --silent --show-error               --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${deploy_id}"               --header "Authorization: Bearer ${RENDER_API_KEY}"               > artifacts/render-deploy-status.json
            status="$(jq -r '.status // empty' artifacts/render-deploy-status.json)"
            if [ "$status" = "live" ]; then
              break
            fi
            if [[ "$status" == *failed ]] || [ "$status" = "canceled" ]; then
              jq '{id,status,createdAt,finishedAt}' artifacts/render-deploy-status.json
              exit 1
            fi
            sleep 5
          done
          test "$status" = "live"

      - name: Verify Render Postgres readiness
        shell: bash
        run: |
          for attempt in {1..18}; do
            if payload="$(curl --fail --silent --show-error "${NEURALOPS_DEPLOYED_API_URL}/ready")"; then
              echo "$payload" | jq -e '.ok == true and .storage == "postgres" and .startup == "ready"'
              exit 0
            fi
            sleep 5
          done
          echo "Render backend did not report Postgres readiness within the bounded window."
          exit 1

      - name: Verify Supabase row-level security
        shell: bash
        run: |
          python backend/scripts/verify_supabase_rls.py > artifacts/supabase-rls.txt

      - name: Run authenticated production acceptance
        shell: bash
        run: node scripts/verify-deployment.mjs

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-deploy-${{ github.sha }}
          path: |
            artifacts/render-deploy*.json
            artifacts/deployment-verification.json
            artifacts/supabase-rls.txt
          if-no-files-found: warn
          retention-days: 30
