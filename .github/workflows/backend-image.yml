name: Build Backend Image

on:
  push:
    branches: [main]
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.repository == 'Gowrav-M/neuralops-platform'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Validate version tag before publishing
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image locally for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          load: true
          push: false
          tags: ghcr.io/gowrav-m/neuralops-api:${{ github.sha }}

      - name: Fail on high or critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/gowrav-m/neuralops-api:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned backend image
        shell: bash
        run: |
          docker push "ghcr.io/gowrav-m/neuralops-api:${GITHUB_SHA}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            docker tag "ghcr.io/gowrav-m/neuralops-api:${GITHUB_SHA}" "ghcr.io/gowrav-m/neuralops-api:${GITHUB_REF_NAME}"
            docker push "ghcr.io/gowrav-m/neuralops-api:${GITHUB_REF_NAME}"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            docker tag "ghcr.io/gowrav-m/neuralops-api:${GITHUB_SHA}" "ghcr.io/gowrav-m/neuralops-api:latest"
            docker push "ghcr.io/gowrav-m/neuralops-api:latest"
          fi
