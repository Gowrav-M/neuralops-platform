name: Bug report
description: Report a reproducible problem in NeuralOps.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, tokens, customer data, or security vulnerabilities here.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Tell us the smallest reliable sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Version, operating system, browser, and deployment type.
