[project]
name = "neuralops-sdk"
version = "0.2.0"
description = "Python SDK for NeuralOps traces and pre-execution agent action authorization."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "NeuralOps" }]
dependencies = []

[project.optional-dependencies]
openai-agents = ["openai-agents>=0.24,<0.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neuralops"]
